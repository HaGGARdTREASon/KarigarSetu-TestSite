<!DOCTYPE html>
<html>
<head>
    <title>Product Name Generator</title>
    <meta charset="UTF-8">
      <link rel="stylesheet" href="style.css">
  <style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 24px;
}
  </style>
</head>
<body>
    <div class="container">
        <h3>Product Name Generator</h3>
        <input type="text" id="name-input" placeholder="Enter keywords (e.g., handmade soap)">
        <button onclick="generateName()">Generate Name</button>
        <p id="generated-name"></p>
    </div>

    <script>
        function generateName() {
            const keywords = document.getElementById('name-input').value.trim();
            if (!keywords) {
                document.getElementById('generated-name').innerText = "Please enter some keywords.";
                return;
            }

            const indianWords1 = [
                "Karigar", "Kala", "Desi", "Bharat", "Shilp", "Hunar", "Haath", "Gram", "Udyog",
                "Sansaar", "Bazaar", "Swadeshi", "Jeevan", "Setu", "Mitra", "Mandir", "Nirmaan",
                "Vastra", "Saanjh", "Rang", "Dhaga", "Kalaakriti", "Lok", "Sanskriti", "Utsav",
                "Bandhan", "Kriti", "Rachna", "Gharana", "Kaarigari", "Saathi", "Milan", "Sabhyata"
            ];

            const indianWords2 = [
                "Setu", "Sansaar", "Bazaar", "Kart", "Adda", "Mitra", "Junction", "Nest", "Hub",
                "Corner", "Mart", "Dukaan", "Saathi", "Express", "Vastra", "Milan", "Manch",
                "Udyog", "Point", "Lok", "Mandap", "Kendra", "Vihar", "Gully", "Marg", "Yatra"
            ];

            const nameIdeas = [];

            // Generate Indian-style name suggestions
            for (let word1 of indianWords1) {
                for (let word2 of indianWords2) {
                    nameIdeas.push(`${word1}${word2}`);
                    nameIdeas.push(`${word1}${keywords}`);
                    nameIdeas.push(`${keywords}${word2}`);
                }
            }

            const randomName = nameIdeas[Math.floor(Math.random() * nameIdeas.length)];
            document.getElementById('generated-name').innerText = `Suggested Name: ${randomName}`;
        }
    </script>
</body>
</html>
