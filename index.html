<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <meta charset="UTF-8">
      <link rel="stylesheet" href="style.css">
  <style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 24px;
}
  </style>
    <script>
        function redirectAfterLogin(event) {
            event.preventDefault(); // Prevent form submission
            window.location.href = "home.html#";
        }
    </script>
</head>
<body>
    <div class="login-container">
        <img src="Logo 3.jpg" alt="User Image">
        <h1>Empowering Artisans and Enriching The Globe</h1>
        <h2>Please enter your details for login</h2>
        
        <form onsubmit="redirectAfterLogin(event);">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button> <!-- Login button moved below the password field -->
            <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
        </form>
    </div>
</body>
</html>
