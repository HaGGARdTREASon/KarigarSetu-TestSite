<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
  <style>
body { padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Shopping Cart</h1>
  </header>

  <nav>
    <a href="marketplace.html"><button class="modern-clear-btn">Go Back</button></a>
  </nav>

  <div class="container">
    <div class="product-grid">
      <div class="product-card">
        <h2>Your Cart</h2>
        <ul class="cart-items" id="cart-list"></ul>
        <h2>Total: ₹<span id="cart-total">0</span></h2>
        <button class="modern-clear-btn" onclick="clearCart()">Clear Cart</button>
      </div>
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function updateCartView() {
      const cartList = document.getElementById('cart-list');
      const cartTotal = document.getElementById('cart-total');
      cartList.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        let listItem = document.createElement('li');
        const thumb = item.image ? `<img class="item-thumb" src="${item.image}" alt="">` : "";
        listItem.innerHTML = `${thumb}<span class="item-name">${item.name}</span><span class="item-price">₹${item.price}</span> <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>`;
        cartList.appendChild(listItem);
        total += item.price;
      });

      cartTotal.innerText = total;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartView();
    }

    function clearCart() {
      localStorage.removeItem('cart');
      cart = [];
      updateCartView();
    }

    updateCartView();
  </script>
</body>
</html>
