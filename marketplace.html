<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace</title>
    <link rel="stylesheet" href="style.css">
  <style>
body { padding: 20px; }

/* Restore original full-width marketplace layout (clay styling kept) */
.container {
  width: auto;
  max-width: 1300px;
  margin-left: auto;
  margin-right: auto;
  background: rgba(250, 240, 226, 0.4);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: 0 14px 30px rgba(133, 98, 60, 0.22),
              inset 0 2px 8px rgba(255, 255, 255, 0.35);
}
.product-grid { gap: 40px; }
header { font-size: clamp(40px, 6vw, 62px); padding: 20px 28px; }
header .logo { font-size: clamp(40px, 6.5vw, 64px); }
  </style>
</head>
<body>


<header>
  <div class="logo">🛒 Marketplace 🔖</div>
</header>

<nav>
  <a href="home.html"><img src="34.jpg" alt="Home" class="icon"></a>
  <a href="cart.html"><img src="30.png" alt="Cart" class="icon"> (<span id="cart-count">0</span>)</a>
  <a href="wishlist.html"><img src="31.png" alt="Wishlist" class="icon"> (<span id="wishlist-count">0</span>)</a>

</nav>

<div class="container">
  <div class="product-grid" id="product-list">
  <div class="product-card">
      <img src="30.jpg" alt="Product 1">
      <h3>Product Name 1</h3>
      <p>₹1399.00</p>
      <button onclick="addToCart('Product Name 1', 1399, '30.jpg')">Add to Cart</button>
      <button onclick="addToWishlist('Product Name 1', 1399, '30.jpg')">Add to Wishlist</button>
    </div>
    <div class="product-card">
      <img src="33.jpg" alt="Product 2">
      <h3>Product Name 2</h3>
      <p>₹1699.00</p>
      <button onclick="addToCart('Product Name 2', 1699, '33.jpg')">Add to Cart</button>
      <button onclick="addToWishlist('Product Name 2', 1699, '33.jpg')">Add to Wishlist</button>
    </div>
    <div class="product-card">
      <img src="32.jpg" alt="Product 3">
      <h3>Product Name 3</h3>
      <p>₹1999.00</p>
      <button onclick="addToCart('Product Name 3', 1999, '32.jpg')">Add to Cart</button>
      <button onclick="addToWishlist('Product Name 3', 1999, '32.jpg')">Add to Wishlist</button>
    </div>
    <div class="product-card">
      <img src="31.jpg" alt="Product 4">
      <h3>Product Name 4</h3>
      <p>₹1599.00</p>
      <button onclick="addToCart('Product Name 4', 1599, '31.jpg')">Add to Cart</button>
      <button onclick="addToWishlist('Product Name 4', 1599, '31.jpg')">Add to Wishlist</button>
    </div>
  </div>
</div>

<script>
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

  function addToCart(productName, price, image = '') {
    cart.push({ name: productName, price: price, image: image });
    localStorage.setItem('cart', JSON.stringify(cart));
    document.getElementById('cart-count').innerText = cart.length;
    alert(`${productName} has been added to your cart.`);
  }

  function addToWishlist(productName, price, image = '') {
    wishlist.push({ name: productName, price: price, image: image });
    localStorage.setItem('wishlist', JSON.stringify(wishlist));
    document.getElementById('wishlist-count').innerText = wishlist.length;
    alert(`${productName} has been added to your wishlist.`);
  }

  document.getElementById('cart-count').innerText = cart.length;
  document.getElementById('wishlist-count').innerText = wishlist.length;
</script>


</body>
</html>
