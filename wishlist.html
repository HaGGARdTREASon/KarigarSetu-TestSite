<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wishlist</title>
    <link rel="stylesheet" href="style.css">
  <style>
body { padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>🔖 Wishlist</h1>
  </header>

  <nav>
    <a href="marketplace.html">
      <button class="modern-clear-btn" type="button">Go Back</button>
    </a>
  </nav>

  <div class="container">
    <div class="product-grid" id="product-list">
      <div class="product-card">
        <h2>Your Wishlist</h2>
        <ul class="wishlist-items" id="wishlist-list"></ul>
        <p>Total: ₹<span id="wishlist-total">0</span></p>
        <button class="modern-clear-btn" onclick="clearWishlist()">Clear Wishlist</button>
      </div>
    </div>
  </div>

  <script>
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

    function updateWishlistView() {
      const wishlistList = document.getElementById('wishlist-list');
      const wishlistTotal = document.getElementById('wishlist-total');
      wishlistList.innerHTML = "";
      let total = 0;

      wishlist.forEach((item, index) => {
        let listItem = document.createElement('li');
        const thumb = item.image ? `<img class="item-thumb" src="${item.image}" alt="">` : "";
        listItem.innerHTML = `${thumb}<span class="item-name">${item.name}</span><span class="item-price">₹${parseFloat(item.price)}</span> <button class="remove-btn" onclick="removeFromWishlist(${index})">Remove</button>`;
        wishlistList.appendChild(listItem);
        total += parseFloat(item.price);
      });

      wishlistTotal.innerText = total.toFixed(2);
    }

    function removeFromWishlist(index) {
      wishlist.splice(index, 1);
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
      updateWishlistView();
    }

    function clearWishlist() {
      localStorage.removeItem('wishlist');
      wishlist = [];
      updateWishlistView();
    }

    updateWishlistView();
  </script>
</body>
</html>
